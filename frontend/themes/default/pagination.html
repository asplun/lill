{if $pagination && $pagination.totalPages > 1}
<nav class="pagination" aria-label="文章分页">
  {if $pagination.hasPrev}<a rel="prev" href="{$page.url}?page={$pagination.page - 1}{if $page.query.q}&amp;q={$page.query.q|urlencode}{/if}{if $page.query.month}&amp;month={$page.query.month|urlencode}{/if}">上一页</a>{/if}
  <span>第 {$pagination.page} / {$pagination.totalPages} 页</span>
  {if $pagination.hasNext}<a rel="next" href="{$page.url}?page={$pagination.page + 1}{if $page.query.q}&amp;q={$page.query.q|urlencode}{/if}{if $page.query.month}&amp;month={$page.query.month|urlencode}{/if}">下一页</a>{/if}
</nav>
{/if}
