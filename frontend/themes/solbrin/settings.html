<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Solbrin 主题设置</title>
  <link rel="stylesheet" href="/themes/solbrin/settings.css">
</head>
<body>
  <div class="settings-shell">
    <header class="settings-head">
      <div class="settings-brand">
        <span class="settings-mark" aria-hidden="true">S</span>
        <div>
          <h1>Solbrin</h1>
          <p>主题设置</p>
        </div>
      </div>
      <div class="settings-head__actions">
        <a class="settings-link" href="/" target="_blank" rel="noopener">查看站点</a>
        <a class="settings-link" href="/admin/">返回后台</a>
      </div>
    </header>

    <div class="settings-layout">
      <aside class="settings-side">
        <div class="settings-preview" aria-label="首页影像预览">
          <img id="settings-preview-image" src="/themes/solbrin/assets/home-mist.jpg" alt="">
          <div class="settings-preview__shade" aria-hidden="true"></div>
          <div class="settings-preview__copy">
            <strong>{$site.name|default:'个人手记'}</strong>
            <span>在设计与代码之间，记录生活的另一种可能。</span>
          </div>
          <span class="settings-preview__badge" id="settings-preview-type">图片</span>
        </div>
        <nav class="settings-nav" id="settings-nav" aria-label="设置分组"></nav>
        <p class="settings-note">设置只影响 Solbrin 主题，不会覆盖 Lill 的其他主题配置。</p>
      </aside>

      <main class="settings-main">
        <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
        <div class="settings-loading" id="settings-loading">
          <span class="settings-spinner" aria-hidden="true"></span>
          <span>正在读取设置</span>
        </div>
        <form class="settings-form" id="settings-form" hidden>
          <div id="settings-groups"></div>
          <footer class="settings-savebar">
            <span class="settings-dirty" id="settings-dirty">尚未修改</span>
            <button class="settings-save" id="settings-save" type="submit" disabled>保存设置</button>
          </footer>
        </form>
      </main>
    </div>
  </div>
  <script src="/api.js"></script>
  <script src="/themes/solbrin/settings.js"></script>
</body>
</html>
