# ===== lill 路由规则（粘贴进面板「伪静态」文本框）=====
# 面板已经提供：root、index、敏感文件拦截、证书验证目录、/.well-known。
# 这里只补 lill 自己的路由。路径不同时只改这两处：
#   上传目录  /www/wwwroot/lill/backend/uploads/
#   （静态根在站点「网站目录」里设，不在本文件）
#
# 为什么大量用 ^~：宝塔静态站 vhost 自带两条正则 location
#   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$   → 30d 缓存
#   location ~ .*\.(js|css)?$                     → 12h 缓存
# nginx 里「正则」优先于「普通前缀」。不加 ^~ 的话
# /themes/x/style.css 会被上面的正则接走，no-cache 失效，改主题看不到效果。

# 引擎入口固定，活动主题脚本由 bootstrap.themeId 决定
location = /theme.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# 后端 API
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 160s;
    client_max_body_size 50M;
}

# 上传文件由 Nginx 直读，绕过 Node
location ^~ /uploads/ {
    alias /www/wwwroot/lill/backend/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# 主题：缺失即 404，绝不回退首页（回退会让浏览器报 Unexpected token '<'）
# ^~ 会跳过外层正则，所以 backend/node_modules 的拦截要写成嵌套 location
location ^~ /themes/ {
    add_header Cache-Control "no-cache";
    location ~ ^/themes/[^/]+/(backend|node_modules)(/|$) {
        return 404;
    }
    # 主题静态资源（字体/CSS/JS/lib）带 ?v= 版本号，可长缓存；模板与 theme.js/style.css 仍 no-cache
    location ~* ^/themes/[^/]+/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    try_files $uri =404;
}

# 构建产物：带哈希，可以长缓存
location ^~ /_astro/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 后台静态资源：面板那两条正则会给它们 12h 缓存，升级后容易读到旧文件
location ^~ /admin/ {
    add_header Cache-Control "no-cache";
    location ~ ^/admin/.+\.(css|js|map|svg|png|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    try_files $uri $uri/ /admin/index.html;
}

# 源码和依赖文件留在磁盘，但不对外提供
location ~ ^/(src|public|dist|node_modules)(/|$) {
    return 404;
}

# Typecho 风格的 .html 永久链接落到 page 外壳
location ~ ^/index\.php/(.+\.html)$ { rewrite ^/index\.php/(.+\.html)$ /page/index.html last; }
location ~ ^/(.+\.html)$ { rewrite ^/(.+\.html)$ /page/index.html last; }

# 动态路由回退到各自的静态壳
# ^~ /archives/ 必须在下面 ^/(.+\.html)$ 正则之前用前缀匹配：Typecho 风格文章链接
# /archives/{slug}.html 会被那条正则接走落到 /page/index.html（data-page=page），
# 引擎便按 type=page 去取数据 → 404。这里直接给 post 壳（data-page=post）。
location ^~ /archives/ { try_files $uri $uri/ /post/index.html; }
location ^~ /post/     { try_files $uri $uri/ /post/index.html; }
location ^~ /category/ { try_files $uri $uri/ /category/index.html; }
location ^~ /tag/      { try_files $uri $uri/ /tag/index.html; }
location ^~ /page/     { try_files $uri $uri/ /page/index.html; }
location ^~ /search/   { try_files $uri $uri/ /search/index.html; }

# RSS 与 SEO 走后端
location = /feed.xml {
    proxy_pass http://127.0.0.1:3000/api/v1/feed;
    proxy_set_header Host $host;
}
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000/api/v1/sitemap.xml;
    proxy_set_header Host $host;
}
location = /robots.txt {
    proxy_pass http://127.0.0.1:3000/robots.txt;
    proxy_set_header Host $host;
}

location = /favicon.ico {
    try_files /favicon.svg =404;
}

# 应用内 404 外壳，只给内部跳转用
location = /404.html {
    internal;
    try_files $uri =404;
}

# 前端静态文件
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
